<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escuela Futurística</title>
    <link rel="stylesheet" href="styles.css">
    
</head>

<body>

    <header>
        <h1 id="titulo">Escuela Futurística de Programación</h1>
        <button id="boton">Modo Oscuro</button>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Cursos</a>
        <a href="#">Profesores</a>
        <a href="#">Contacto</a>
    </nav>

    <main>

        <section class="tarjeta">
            <h2>Curso HTML</h2>
            <p>Aprende a crear páginas web desde cero.</p>
            <button class="inscribirse">Inscribirme</button>
        </section>

        <section class="tarjeta">
            <h2>Curso CSS</h2>
            <p>Diseña páginas modernas y atractivas.</p>
            <button class="inscribirse">Inscribirme</button>
        </section>

        <section class="tarjeta">
            <h2>Curso JavaScript</h2>
            <p>Haz que tus páginas cobren vida.</p>
            <button class="inscribirse">Inscribirme</button>
        </section>

        <section class="formulario">
            <h2>Contacto</h2>
            <form id="formulario">
                <input type="text" id="nombre" placeholder="Tu nombre">
                <input type="email" id="email" placeholder="Tu email">
                <button class="botonForm" type="submit">Enviar</button>
            </form>
            <p id="mensaje"></p>
        </section>

    </main>

    <footer>
        <p>© 2026 Escuela Futurística</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
